<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backtesting Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold mb-8 text-gray-800">Stock/ETF Backtesting Engine</h1>
        
        <!-- Navigation Tabs -->
        <div class="mb-6 border-b border-gray-300">
            <nav class="flex space-x-4">
                <button onclick="showTab('run')" id="tab-run" class="tab-button px-4 py-2 font-semibold text-blue-600 border-b-2 border-blue-600">
                    Run Backtest
                </button>
                <button onclick="showTab('builder')" id="tab-builder" class="tab-button px-4 py-2 font-semibold text-gray-600 hover:text-blue-600">
                    Strategy Builder
                </button>
                <button onclick="showTab('results')" id="tab-results" class="tab-button px-4 py-2 font-semibold text-gray-600 hover:text-blue-600">
                    Results
                </button>
                <button onclick="showTab('compare')" id="tab-compare" class="tab-button px-4 py-2 font-semibold text-gray-600 hover:text-blue-600">
                    Compare
                </button>
            </nav>
        </div>
        
        <!-- Run Backtest Tab -->
        <div id="tab-content-run" class="tab-content">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-4">Run New Backtest</h2>
                
                <form id="backtest-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Select Strategy</label>
                        <div class="flex space-x-2 mb-2">
                            <select id="strategy-select" class="flex-1 border border-gray-300 rounded-md p-2" onchange="loadStrategy()">
                                <option value="">-- Select a strategy file --</option>
                            </select>
                            <button type="button" onclick="loadStrategy()" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">
                                Load
                            </button>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Strategy YAML</label>
                        <textarea id="strategy-yaml" rows="15" class="w-full border border-gray-300 rounded-md p-2 font-mono text-sm" required>
name: buy_and_hold
universe:
  - SPY
  - QQQ
position_sizing: equal_weight
execution: first_day_only
                        </textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Start Date</label>
                            <input type="date" id="start-date" class="w-full border border-gray-300 rounded-md p-2" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">End Date</label>
                            <input type="date" id="end-date" class="w-full border border-gray-300 rounded-md p-2" required>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Initial Cash</label>
                            <input type="number" id="initial-cash" value="10000" class="w-full border border-gray-300 rounded-md p-2" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Run Name (optional)</label>
                            <input type="text" id="run-name" class="w-full border border-gray-300 rounded-md p-2">
                        </div>
                    </div>
                    
                    <div class="flex space-x-4">
                        <button type="button" onclick="validateStrategy()" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">
                            Validate Strategy
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            Run Backtest
                        </button>
                    </div>
                </form>
                
                <div id="job-status" class="mt-4 hidden">
                    <div class="bg-blue-50 border border-blue-200 rounded-md p-4">
                        <p class="font-semibold">Status: <span id="job-status-text">Running...</span></p>
                        <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                            <div id="job-progress" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                        <p id="job-message" class="text-sm text-gray-600 mt-2"></p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Strategy Builder Tab -->
        <div id="tab-content-builder" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-4">Strategy Builder</h2>
                
                <form id="strategy-builder-form" class="space-y-6">
                    <!-- Strategy Type -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Strategy Type</label>
                        <select id="builder-strategy-type" class="w-full border border-gray-300 rounded-md p-2" onchange="updateBuilderForm()">
                            <option value="buy_and_hold">Buy and Hold</option>
                            <option value="dca">Dollar Cost Averaging (DCA)</option>
                            <option value="laggard_rotation">Laggard Rotation</option>
                            <option value="momentum_winner">Momentum Winner</option>
                            <option value="mixed_winners_losers">Mixed Winners & Losers</option>
                        </select>
                    </div>
                    
                    <!-- Asset Universe -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Asset Universe (Tickers)</label>
                        <div class="flex space-x-2 mb-2">
                            <input type="text" id="builder-ticker-input" placeholder="Enter ticker (e.g., SPY)" class="flex-1 border border-gray-300 rounded-md p-2" onkeypress="if(event.key==='Enter'){event.preventDefault();addTicker();}">
                            <button type="button" onclick="addTicker()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Add</button>
                            <button type="button" onclick="validateTickers()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">Validate All</button>
                        </div>
                        <div id="builder-tickers-list" class="flex flex-wrap gap-2 mb-2"></div>
                        <button type="button" onclick="loadTickerLibrary()" class="text-sm text-blue-600 hover:underline">Browse discovered tickers...</button>
                    </div>
                    
                    <!-- Strategy-specific parameters -->
                    <div id="builder-parameters"></div>
                    
                    <!-- Capital Schedule -->
                    <div class="border-t pt-4">
                        <h3 class="text-lg font-semibold mb-3">Capital Schedule</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Initial Cash</label>
                                <input type="number" id="builder-initial-cash" value="10000" class="w-full border border-gray-300 rounded-md p-2" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Recurring Contribution</label>
                                <div class="flex space-x-2">
                                    <input type="number" id="builder-recurring-amount" value="0" placeholder="Amount" class="flex-1 border border-gray-300 rounded-md p-2">
                                    <select id="builder-recurring-frequency" class="border border-gray-300 rounded-md p-2">
                                        <option value="">None</option>
                                        <option value="weekly">Weekly</option>
                                        <option value="monthly">Monthly</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Execution Settings -->
                    <div class="border-t pt-4">
                        <h3 class="text-lg font-semibold mb-3">Execution Settings</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Execution Timing</label>
                                <select id="builder-execution" class="w-full border border-gray-300 rounded-md p-2">
                                    <option value="next_open">Next Open</option>
                                    <option value="same_day">Same Day</option>
                                    <option value="market_close">Market Close</option>
                                    <option value="first_day_only">First Day Only</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Position Sizing</label>
                                <select id="builder-position-sizing" class="w-full border border-gray-300 rounded-md p-2">
                                    <option value="equal_weight">Equal Weight</option>
                                    <option value="single_asset">Single Asset</option>
                                    <option value="all_in_on_signal">All In On Signal</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Generated YAML Preview -->
                    <div class="border-t pt-4">
                        <h3 class="text-lg font-semibold mb-3">Generated YAML</h3>
                        <textarea id="builder-yaml-output" rows="15" class="w-full border border-gray-300 rounded-md p-2 font-mono text-sm" readonly></textarea>
                        <div class="mt-2 flex space-x-2">
                            <button type="button" onclick="copyYAML()" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">Copy YAML</button>
                            <button type="button" onclick="loadYAMLToEditor()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Use in Backtest</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Results Tab -->
        <div id="tab-content-results" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-4">Backtest Results</h2>
                
                <div id="runs-list" class="space-y-4">
                    <p class="text-gray-600">Loading runs...</p>
                </div>
            </div>
        </div>
        
        <!-- Compare Tab -->
        <div id="tab-content-compare" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-4">Compare Runs</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Run 1</label>
                        <select id="compare-run1" class="w-full border border-gray-300 rounded-md p-2">
                            <option value="">Select run...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Run 2</label>
                        <select id="compare-run2" class="w-full border border-gray-300 rounded-md p-2">
                            <option value="">Select run...</option>
                        </select>
                    </div>
                </div>
                
                <button onclick="compareRuns()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                    Compare
                </button>
                
                <div id="comparison-results" class="mt-6"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentJobId = null;
        let jobCheckInterval = null;
        
        // Strategy builder state
        let builderTickers = [];
        let builderStrategyType = 'buy_and_hold';
        
        // Tab switching
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(el => {
                el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                el.classList.add('text-gray-600');
            });
            
            document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.remove('text-gray-600');
            document.getElementById(`tab-${tabName}`).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            
            if (tabName === 'results') {
                loadRuns();
            } else if (tabName === 'compare') {
                loadRunsForCompare();
            } else if (tabName === 'builder') {
                updateBuilderForm();
                generateYAML();
            }
        }
        
        // Strategy Builder Functions
        function addTicker() {
            const input = document.getElementById('builder-ticker-input');
            const ticker = input.value.trim().toUpperCase();
            if (ticker && !builderTickers.includes(ticker)) {
                builderTickers.push(ticker);
                updateTickerList();
                input.value = '';
                generateYAML();
            }
        }
        
        function removeTicker(ticker) {
            builderTickers = builderTickers.filter(t => t !== ticker);
            updateTickerList();
            generateYAML();
        }
        
        function updateTickerList() {
            const container = document.getElementById('builder-tickers-list');
            container.innerHTML = builderTickers.map(ticker => `
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-800">
                    ${ticker}
                    <button onclick="removeTicker('${ticker}')" class="ml-2 text-blue-600 hover:text-blue-800">×</button>
                </span>
            `).join('');
        }
        
        async function validateTickers() {
            if (builderTickers.length === 0) {
                alert('Please add tickers first');
                return;
            }
            
            try {
                const response = await fetch('/api/tickers/validate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({tickers: builderTickers})
                });
                
                const result = await response.json();
                if (result.success) {
                    if (result.invalid.length > 0) {
                        alert('Invalid tickers: ' + result.invalid.join(', '));
                        builderTickers = builderTickers.filter(t => !result.invalid.includes(t));
                        updateTickerList();
                    } else {
                        alert('All tickers validated successfully!');
                    }
                    generateYAML();
                }
            } catch (error) {
                alert('Error validating tickers: ' + error.message);
            }
        }
        
        async function loadTickerLibrary() {
            try {
                const response = await fetch('/api/tickers/list');
                const result = await response.json();
                
                if (result.success && result.tickers.length > 0) {
                    const tickerList = result.tickers.map(t => 
                        `${t.ticker} - ${t.company_name} (${t.asset_type})`
                    ).join('\n');
                    
                    const selected = prompt('Available tickers:\n\n' + tickerList + '\n\nEnter ticker to add:');
                    if (selected) {
                        const ticker = selected.split(' - ')[0].trim().toUpperCase();
                        if (!builderTickers.includes(ticker)) {
                            builderTickers.push(ticker);
                            updateTickerList();
                            generateYAML();
                        }
                    }
                } else {
                    alert('No tickers discovered yet. Add tickers in a strategy and they will be cached.');
                }
            } catch (error) {
                alert('Error loading ticker library: ' + error.message);
            }
        }
        
        function updateBuilderForm() {
            builderStrategyType = document.getElementById('builder-strategy-type').value;
            const paramsDiv = document.getElementById('builder-parameters');
            
            let html = '<div class="border-t pt-4"><h3 class="text-lg font-semibold mb-3">Strategy Parameters</h3>';
            
            if (builderStrategyType === 'laggard_rotation' || builderStrategyType === 'momentum_winner') {
                html += `
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Lookback Days</label>
                            <input type="number" id="param-lookback-days" value="20" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Count</label>
                            <input type="number" id="param-count" value="1" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Cooldown Days</label>
                            <input type="number" id="param-cooldown-days" value="0" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                        </div>
                    </div>
                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Rebalance Frequency</label>
                        <select id="param-rebalance-frequency" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="daily">Daily</option>
                        </select>
                    </div>
                `;
            } else if (builderStrategyType === 'mixed_winners_losers') {
                html += `
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Lookback Days</label>
                            <input type="number" id="param-lookback-days" value="15" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Cooldown Days</label>
                            <input type="number" id="param-cooldown-days" value="10" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Winner Count</label>
                            <input type="number" id="param-winner-count" value="1" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Laggard Count</label>
                            <input type="number" id="param-laggard-count" value="1" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                        </div>
                    </div>
                    <div class="mt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Rebalance Frequency</label>
                        <select id="param-rebalance-frequency" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                `;
            } else if (builderStrategyType === 'dca') {
                html += `
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Contribution Amount</label>
                            <input type="number" id="param-contribution-amount" value="100" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Contribution Frequency</label>
                            <select id="param-contribution-frequency" class="w-full border border-gray-300 rounded-md p-2" onchange="generateYAML()">
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>
                    </div>
                `;
            }
            
            html += '</div>';
            paramsDiv.innerHTML = html;
            generateYAML();
        }
        
        function generateYAML() {
            const strategyType = document.getElementById('builder-strategy-type').value;
            let yaml = `name: ${strategyType}\n`;
            
            if (builderTickers.length > 0) {
                yaml += 'universe:\n';
                builderTickers.forEach(ticker => {
                    yaml += `  - ${ticker}\n`;
                });
            }
            
            // Add parameters based on strategy type
            if (strategyType === 'laggard_rotation' || strategyType === 'momentum_winner') {
                yaml += 'parameters:\n';
                yaml += `  lookback_days: ${document.getElementById('param-lookback-days')?.value || 20}\n`;
                const countField = strategyType === 'laggard_rotation' ? 'laggard_count' : 'winner_count';
                yaml += `  ${countField}: ${document.getElementById('param-count')?.value || 1}\n`;
                yaml += `  cooldown_days: ${document.getElementById('param-cooldown-days')?.value || 0}\n`;
                yaml += `rebalance_frequency: ${document.getElementById('param-rebalance-frequency')?.value || 'weekly'}\n`;
            } else if (strategyType === 'mixed_winners_losers') {
                yaml += 'parameters:\n';
                yaml += `  lookback_days: ${document.getElementById('param-lookback-days')?.value || 15}\n`;
                yaml += `  winner_count: ${document.getElementById('param-winner-count')?.value || 1}\n`;
                yaml += `  laggard_count: ${document.getElementById('param-laggard-count')?.value || 1}\n`;
                yaml += `  cooldown_days: ${document.getElementById('param-cooldown-days')?.value || 10}\n`;
                yaml += `rebalance_frequency: ${document.getElementById('param-rebalance-frequency')?.value || 'weekly'}\n`;
            } else if (strategyType === 'dca') {
                yaml += `contribution_amount: ${document.getElementById('param-contribution-amount')?.value || 100}\n`;
                yaml += `contribution_frequency: ${document.getElementById('param-contribution-frequency')?.value || 'weekly'}\n`;
            }
            
            yaml += `position_sizing: ${document.getElementById('builder-position-sizing')?.value || 'equal_weight'}\n`;
            yaml += `execution: ${document.getElementById('builder-execution')?.value || 'next_open'}\n`;
            
            document.getElementById('builder-yaml-output').value = yaml;
        }
        
        function copyYAML() {
            const yaml = document.getElementById('builder-yaml-output').value;
            navigator.clipboard.writeText(yaml).then(() => {
                alert('YAML copied to clipboard!');
            });
        }
        
        function loadYAMLToEditor() {
            const yaml = document.getElementById('builder-yaml-output').value;
            document.getElementById('strategy-yaml').value = yaml;
            showTab('run');
        }
        
        // Add event listeners for builder form changes
        document.addEventListener('DOMContentLoaded', () => {
            const builderForm = document.getElementById('strategy-builder-form');
            if (builderForm) {
                // Use event delegation for dynamically added inputs
                builderForm.addEventListener('input', (e) => {
                    if (e.target.id.startsWith('param-') || e.target.id.startsWith('builder-')) {
                        generateYAML();
                    }
                });
                builderForm.addEventListener('change', (e) => {
                    if (e.target.id.startsWith('param-') || e.target.id.startsWith('builder-')) {
                        generateYAML();
                    }
                });
            }
        });
        
        // Backtest form submission
        document.getElementById('backtest-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                strategy_yaml: document.getElementById('strategy-yaml').value,
                start_date: document.getElementById('start-date').value,
                end_date: document.getElementById('end-date').value,
                initial_cash: parseFloat(document.getElementById('initial-cash').value),
                run_name: document.getElementById('run-name').value || null
            };
            
            try {
                const response = await fetch('/api/backtest/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    currentJobId = result.job_id;
                    document.getElementById('job-status').classList.remove('hidden');
                    startJobPolling(result.job_id);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
        
        // Validate strategy
        async function validateStrategy() {
            const yaml = document.getElementById('strategy-yaml').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            if (!yaml || !startDate || !endDate) {
                alert('Please fill in all fields');
                return;
            }
            
            try {
                const response = await fetch('/api/backtest/validate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        strategy_yaml: yaml,
                        start_date: startDate,
                        end_date: endDate
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    const validation = result.validation;
                    if (validation.valid) {
                        alert('Strategy is valid!');
                    } else {
                        alert('Validation errors:\n' + validation.errors.join('\n'));
                    }
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Job polling
        function startJobPolling(jobId) {
            if (jobCheckInterval) clearInterval(jobCheckInterval);
            
            jobCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/jobs/${jobId}`);
                    const result = await response.json();
                    
                    if (result.success) {
                        const job = result.job;
                        document.getElementById('job-status-text').textContent = job.status;
                        document.getElementById('job-progress').style.width = job.progress + '%';
                        document.getElementById('job-message').textContent = job.message;
                        
                        if (job.status === 'completed') {
                            clearInterval(jobCheckInterval);
                            setTimeout(() => {
                                showTab('results');
                                loadRuns();
                            }, 2000);
                        } else if (job.status === 'failed') {
                            clearInterval(jobCheckInterval);
                        }
                    }
                } catch (error) {
                    console.error('Error polling job:', error);
                }
            }, 1000);
        }
        
        // Load runs
        async function loadRuns() {
            try {
                const response = await fetch('/api/runs');
                const result = await response.json();
                
                if (result.success) {
                    const runs = result.runs;
                    const container = document.getElementById('runs-list');
                    
                    if (runs.length === 0) {
                        container.innerHTML = '<p class="text-gray-600">No runs yet. Run a backtest to see results here.</p>';
                        return;
                    }
                    
                    container.innerHTML = runs.map(run => `
                        <div class="border border-gray-300 rounded-md p-4 hover:bg-gray-50">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h3 class="font-semibold text-lg">${run.name}</h3>
                                    <p class="text-sm text-gray-600">${run.strategy_name} | ${run.start_date} to ${run.end_date}</p>
                                </div>
                                <div class="flex space-x-2">
                                    <button onclick="viewRun(${run.run_id})" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">
                                        View
                                    </button>
                                    <button onclick="deleteRun(${run.run_id})" class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading runs:', error);
            }
        }
        
        // View run details
        async function viewRun(runId) {
            try {
                const response = await fetch(`/api/runs/${runId}`);
                const result = await response.json();
                
                if (result.success) {
                    const run = result.run;
                    // Create a modal or new page to show detailed results
                    alert('Run details:\n' + JSON.stringify(run.metrics, null, 2));
                }
            } catch (error) {
                alert('Error loading run: ' + error.message);
            }
        }
        
        // Delete run
        async function deleteRun(runId) {
            if (!confirm('Are you sure you want to delete this run?')) return;
            
            try {
                const response = await fetch(`/api/runs/${runId}`, {method: 'DELETE'});
                const result = await response.json();
                
                if (result.success) {
                    loadRuns();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Load runs for comparison
        async function loadRunsForCompare() {
            try {
                const response = await fetch('/api/runs');
                const result = await response.json();
                
                if (result.success) {
                    const runs = result.runs;
                    const select1 = document.getElementById('compare-run1');
                    const select2 = document.getElementById('compare-run2');
                    
                    const options = runs.map(run => 
                        `<option value="${run.run_id}">${run.name}</option>`
                    ).join('');
                    
                    select1.innerHTML = '<option value="">Select run...</option>' + options;
                    select2.innerHTML = '<option value="">Select run...</option>' + options;
                }
            } catch (error) {
                console.error('Error loading runs:', error);
            }
        }
        
        // Compare runs
        async function compareRuns() {
            const runId1 = document.getElementById('compare-run1').value;
            const runId2 = document.getElementById('compare-run2').value;
            
            if (!runId1 || !runId2) {
                alert('Please select two runs to compare');
                return;
            }
            
            try {
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({run_id_1: parseInt(runId1), run_id_2: parseInt(runId2)})
                });
                
                const result = await response.json();
                if (result.success) {
                    const comparison = result.comparison;
                    const container = document.getElementById('comparison-results');
                    
                    let html = '<div class="grid grid-cols-2 gap-4 mb-4">';
                    html += '<div><h3 class="font-semibold">' + comparison.run1.name + '</h3>';
                    html += '<pre class="text-sm bg-gray-100 p-2 rounded">' + JSON.stringify(comparison.run1.metrics, null, 2) + '</pre></div>';
                    html += '<div><h3 class="font-semibold">' + comparison.run2.name + '</h3>';
                    html += '<pre class="text-sm bg-gray-100 p-2 rounded">' + JSON.stringify(comparison.run2.metrics, null, 2) + '</pre></div>';
                    html += '</div>';
                    
                    html += '<h3 class="font-semibold mb-2">Differences</h3>';
                    html += '<table class="w-full border-collapse border border-gray-300">';
                    html += '<tr class="bg-gray-100"><th class="border p-2">Metric</th><th class="border p-2">Run 1</th><th class="border p-2">Run 2</th><th class="border p-2">Difference</th><th class="border p-2">Winner</th></tr>';
                    
                    for (const [metric, diff] of Object.entries(comparison.differences)) {
                        html += `<tr>
                            <td class="border p-2">${metric}</td>
                            <td class="border p-2">${diff.run1.toFixed(2)}</td>
                            <td class="border p-2">${diff.run2.toFixed(2)}</td>
                            <td class="border p-2">${diff.difference.toFixed(2)}</td>
                            <td class="border p-2">${diff.winner}</td>
                        </tr>`;
                    }
                    
                    html += '</table>';
                    container.innerHTML = html;
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Load strategy files list
        async function loadStrategyList() {
            try {
                const response = await fetch('/api/strategies/list');
                const result = await response.json();
                
                if (result.success) {
                    const select = document.getElementById('strategy-select');
                    select.innerHTML = '<option value="">-- Select a strategy file --</option>';
                    
                    result.strategies.forEach(strategy => {
                        const option = document.createElement('option');
                        option.value = strategy.filename;
                        option.textContent = strategy.name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading strategy list:', error);
            }
        }
        
        // Load a strategy file
        async function loadStrategy() {
            const select = document.getElementById('strategy-select');
            const filename = select.value;
            
            if (!filename) {
                return;
            }
            
            try {
                const response = await fetch(`/api/strategies/load/${filename}`);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('strategy-yaml').value = result.content;
                } else {
                    alert('Error loading strategy: ' + result.error);
                }
            } catch (error) {
                alert('Error loading strategy: ' + error.message);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            const oneYearAgo = new Date();
            oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
            const oneYearAgoStr = oneYearAgo.toISOString().split('T')[0];
            
            document.getElementById('start-date').value = oneYearAgoStr;
            document.getElementById('end-date').value = today;
            
            // Load strategy list
            loadStrategyList();
        });
    </script>
</body>
</html>
