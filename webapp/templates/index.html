<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backtesting Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold mb-8 text-gray-800">Stock/ETF Backtesting Engine</h1>
        
        <!-- Navigation Tabs -->
        <div class="mb-6 border-b border-gray-300">
            <nav class="flex space-x-4">
                <button onclick="showTab('run')" id="tab-run" class="tab-button px-4 py-2 font-semibold text-blue-600 border-b-2 border-blue-600">
                    Run Backtest
                </button>
                <button onclick="showTab('results')" id="tab-results" class="tab-button px-4 py-2 font-semibold text-gray-600 hover:text-blue-600">
                    Results
                </button>
                <button onclick="showTab('compare')" id="tab-compare" class="tab-button px-4 py-2 font-semibold text-gray-600 hover:text-blue-600">
                    Compare
                </button>
            </nav>
        </div>
        
        <!-- Run Backtest Tab -->
        <div id="tab-content-run" class="tab-content">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-4">Run New Backtest</h2>
                
                <form id="backtest-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Strategy YAML</label>
                        <textarea id="strategy-yaml" rows="15" class="w-full border border-gray-300 rounded-md p-2 font-mono text-sm" required>
name: buy_and_hold
universe:
  - SPY
  - QQQ
position_sizing: equal_weight
execution: first_day_only
                        </textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Start Date</label>
                            <input type="date" id="start-date" class="w-full border border-gray-300 rounded-md p-2" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">End Date</label>
                            <input type="date" id="end-date" class="w-full border border-gray-300 rounded-md p-2" required>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Initial Cash</label>
                            <input type="number" id="initial-cash" value="10000" class="w-full border border-gray-300 rounded-md p-2" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Run Name (optional)</label>
                            <input type="text" id="run-name" class="w-full border border-gray-300 rounded-md p-2">
                        </div>
                    </div>
                    
                    <div class="flex space-x-4">
                        <button type="button" onclick="validateStrategy()" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">
                            Validate Strategy
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            Run Backtest
                        </button>
                    </div>
                </form>
                
                <div id="job-status" class="mt-4 hidden">
                    <div class="bg-blue-50 border border-blue-200 rounded-md p-4">
                        <p class="font-semibold">Status: <span id="job-status-text">Running...</span></p>
                        <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                            <div id="job-progress" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                        <p id="job-message" class="text-sm text-gray-600 mt-2"></p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Results Tab -->
        <div id="tab-content-results" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-4">Backtest Results</h2>
                
                <div id="runs-list" class="space-y-4">
                    <p class="text-gray-600">Loading runs...</p>
                </div>
            </div>
        </div>
        
        <!-- Compare Tab -->
        <div id="tab-content-compare" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-bold mb-4">Compare Runs</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Run 1</label>
                        <select id="compare-run1" class="w-full border border-gray-300 rounded-md p-2">
                            <option value="">Select run...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Run 2</label>
                        <select id="compare-run2" class="w-full border border-gray-300 rounded-md p-2">
                            <option value="">Select run...</option>
                        </select>
                    </div>
                </div>
                
                <button onclick="compareRuns()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                    Compare
                </button>
                
                <div id="comparison-results" class="mt-6"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentJobId = null;
        let jobCheckInterval = null;
        
        // Tab switching
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(el => {
                el.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                el.classList.add('text-gray-600');
            });
            
            document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.remove('text-gray-600');
            document.getElementById(`tab-${tabName}`).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            
            if (tabName === 'results') {
                loadRuns();
            } else if (tabName === 'compare') {
                loadRunsForCompare();
            }
        }
        
        // Backtest form submission
        document.getElementById('backtest-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                strategy_yaml: document.getElementById('strategy-yaml').value,
                start_date: document.getElementById('start-date').value,
                end_date: document.getElementById('end-date').value,
                initial_cash: parseFloat(document.getElementById('initial-cash').value),
                run_name: document.getElementById('run-name').value || null
            };
            
            try {
                const response = await fetch('/api/backtest/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    currentJobId = result.job_id;
                    document.getElementById('job-status').classList.remove('hidden');
                    startJobPolling(result.job_id);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
        
        // Validate strategy
        async function validateStrategy() {
            const yaml = document.getElementById('strategy-yaml').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            if (!yaml || !startDate || !endDate) {
                alert('Please fill in all fields');
                return;
            }
            
            try {
                const response = await fetch('/api/backtest/validate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        strategy_yaml: yaml,
                        start_date: startDate,
                        end_date: endDate
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    const validation = result.validation;
                    if (validation.valid) {
                        alert('Strategy is valid!');
                    } else {
                        alert('Validation errors:\n' + validation.errors.join('\n'));
                    }
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Job polling
        function startJobPolling(jobId) {
            if (jobCheckInterval) clearInterval(jobCheckInterval);
            
            jobCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/jobs/${jobId}`);
                    const result = await response.json();
                    
                    if (result.success) {
                        const job = result.job;
                        document.getElementById('job-status-text').textContent = job.status;
                        document.getElementById('job-progress').style.width = job.progress + '%';
                        document.getElementById('job-message').textContent = job.message;
                        
                        if (job.status === 'completed') {
                            clearInterval(jobCheckInterval);
                            setTimeout(() => {
                                showTab('results');
                                loadRuns();
                            }, 2000);
                        } else if (job.status === 'failed') {
                            clearInterval(jobCheckInterval);
                        }
                    }
                } catch (error) {
                    console.error('Error polling job:', error);
                }
            }, 1000);
        }
        
        // Load runs
        async function loadRuns() {
            try {
                const response = await fetch('/api/runs');
                const result = await response.json();
                
                if (result.success) {
                    const runs = result.runs;
                    const container = document.getElementById('runs-list');
                    
                    if (runs.length === 0) {
                        container.innerHTML = '<p class="text-gray-600">No runs yet. Run a backtest to see results here.</p>';
                        return;
                    }
                    
                    container.innerHTML = runs.map(run => `
                        <div class="border border-gray-300 rounded-md p-4 hover:bg-gray-50">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h3 class="font-semibold text-lg">${run.name}</h3>
                                    <p class="text-sm text-gray-600">${run.strategy_name} | ${run.start_date} to ${run.end_date}</p>
                                </div>
                                <div class="flex space-x-2">
                                    <button onclick="viewRun(${run.run_id})" class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">
                                        View
                                    </button>
                                    <button onclick="deleteRun(${run.run_id})" class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading runs:', error);
            }
        }
        
        // View run details
        async function viewRun(runId) {
            try {
                const response = await fetch(`/api/runs/${runId}`);
                const result = await response.json();
                
                if (result.success) {
                    const run = result.run;
                    // Create a modal or new page to show detailed results
                    alert('Run details:\n' + JSON.stringify(run.metrics, null, 2));
                }
            } catch (error) {
                alert('Error loading run: ' + error.message);
            }
        }
        
        // Delete run
        async function deleteRun(runId) {
            if (!confirm('Are you sure you want to delete this run?')) return;
            
            try {
                const response = await fetch(`/api/runs/${runId}`, {method: 'DELETE'});
                const result = await response.json();
                
                if (result.success) {
                    loadRuns();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Load runs for comparison
        async function loadRunsForCompare() {
            try {
                const response = await fetch('/api/runs');
                const result = await response.json();
                
                if (result.success) {
                    const runs = result.runs;
                    const select1 = document.getElementById('compare-run1');
                    const select2 = document.getElementById('compare-run2');
                    
                    const options = runs.map(run => 
                        `<option value="${run.run_id}">${run.name}</option>`
                    ).join('');
                    
                    select1.innerHTML = '<option value="">Select run...</option>' + options;
                    select2.innerHTML = '<option value="">Select run...</option>' + options;
                }
            } catch (error) {
                console.error('Error loading runs:', error);
            }
        }
        
        // Compare runs
        async function compareRuns() {
            const runId1 = document.getElementById('compare-run1').value;
            const runId2 = document.getElementById('compare-run2').value;
            
            if (!runId1 || !runId2) {
                alert('Please select two runs to compare');
                return;
            }
            
            try {
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({run_id_1: parseInt(runId1), run_id_2: parseInt(runId2)})
                });
                
                const result = await response.json();
                if (result.success) {
                    const comparison = result.comparison;
                    const container = document.getElementById('comparison-results');
                    
                    let html = '<div class="grid grid-cols-2 gap-4 mb-4">';
                    html += '<div><h3 class="font-semibold">' + comparison.run1.name + '</h3>';
                    html += '<pre class="text-sm bg-gray-100 p-2 rounded">' + JSON.stringify(comparison.run1.metrics, null, 2) + '</pre></div>';
                    html += '<div><h3 class="font-semibold">' + comparison.run2.name + '</h3>';
                    html += '<pre class="text-sm bg-gray-100 p-2 rounded">' + JSON.stringify(comparison.run2.metrics, null, 2) + '</pre></div>';
                    html += '</div>';
                    
                    html += '<h3 class="font-semibold mb-2">Differences</h3>';
                    html += '<table class="w-full border-collapse border border-gray-300">';
                    html += '<tr class="bg-gray-100"><th class="border p-2">Metric</th><th class="border p-2">Run 1</th><th class="border p-2">Run 2</th><th class="border p-2">Difference</th><th class="border p-2">Winner</th></tr>';
                    
                    for (const [metric, diff] of Object.entries(comparison.differences)) {
                        html += `<tr>
                            <td class="border p-2">${metric}</td>
                            <td class="border p-2">${diff.run1.toFixed(2)}</td>
                            <td class="border p-2">${diff.run2.toFixed(2)}</td>
                            <td class="border p-2">${diff.difference.toFixed(2)}</td>
                            <td class="border p-2">${diff.winner}</td>
                        </tr>`;
                    }
                    
                    html += '</table>';
                    container.innerHTML = html;
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            const oneYearAgo = new Date();
            oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
            const oneYearAgoStr = oneYearAgo.toISOString().split('T')[0];
            
            document.getElementById('start-date').value = oneYearAgoStr;
            document.getElementById('end-date').value = today;
        });
    </script>
</body>
</html>
